<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HematYuk</title>
    <link rel="manifest" href="manifest.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        
        /* Animasi Transisi Layar */
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-screen { animation: fadeSlideIn 0.4s ease-out forwards; }
        
        /* Menyembunyikan Scrollbar agar terlihat seperti Aplikasi Native */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <!-- Container Utama Aplikasi -->
    <div id="app" class="w-full max-w-md bg-white overflow-hidden relative shadow-2xl h-[100dvh] sm:h-[95vh] sm:max-h-[900px] flex flex-col">

        <!-- ==================== LAYAR 1: LOGIN ==================== -->
        <div id="screen-login" class="flex flex-col h-full bg-[#9cb5ff] p-6 animate-screen justify-center items-center">
            <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm text-center">
                <div class="w-16 h-16 bg-[#9cb5ff] rounded-2xl flex items-center justify-center text-white text-3xl mx-auto mb-4 shadow-md">
                    <i class="fas fa-wallet"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-6 tracking-wider">HEMATYUK</h2>
                
                <input type="text" id="login-username" class="w-full border border-gray-200 p-3 rounded-xl mb-4 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#9cb5ff]" placeholder="User / Nama">
                <input type="password" id="login-password" class="w-full border border-gray-200 p-3 rounded-xl mb-6 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#9cb5ff]" placeholder="Password">
                
                <button onclick="login()" class="w-full bg-[#3b43db] hover:bg-blue-800 text-white p-3 rounded-xl font-bold shadow-md transition transform active:scale-95 mb-4">Masuk</button>
                
                <p class="text-xs text-gray-500 mb-2">Belum punya akun?</p>
                <button onclick="switchScreen('screen-register')" class="bg-gray-200 text-gray-700 py-2 px-6 rounded-full text-xs font-bold hover:bg-gray-300 transition transform active:scale-95">Daftar Baru</button>
            </div>
        </div>

        <!-- ==================== LAYAR 2: REGISTER ==================== -->
        <div id="screen-register" class="flex flex-col h-full bg-[#9cb5ff] p-6 hidden animate-screen justify-center items-center">
            <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm text-center relative">
                <button onclick="switchScreen('screen-login')" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 transition transform active:scale-90">
                    <i class="fas fa-arrow-left text-lg"></i>
                </button>
                <div class="w-16 h-16 bg-[#9cb5ff] rounded-2xl flex items-center justify-center text-white text-3xl mx-auto mb-4 mt-2 shadow-md">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-2">Daftar Akun Baru</h2>
                <p class="text-[10px] text-red-500 mb-6 font-semibold bg-red-50 p-2 rounded-lg">*Harap di ingat untuk nama & password nya</p>
                
                <input type="text" id="reg-username" class="w-full border border-gray-200 p-3 rounded-xl mb-4 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#9cb5ff]" placeholder="Nama User Baru">
                <input type="password" id="reg-password" class="w-full border border-gray-200 p-3 rounded-xl mb-6 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-[#9cb5ff]" placeholder="Buat Password">
                
                <button onclick="register()" class="w-full bg-[#3b43db] hover:bg-blue-800 text-white p-3 rounded-xl font-bold shadow-md transition transform active:scale-95">Simpan & Masuk</button>
            </div>
        </div>

        <!-- ==================== LAYAR 3: DASHBOARD UTAMA ==================== -->
        <div id="screen-main" class="flex-col h-full bg-gray-50 hidden relative">
            
            <!-- Konten Dinamis yang bisa di-scroll -->
            <div class="flex-1 overflow-y-auto pb-20">
                
                <!-- SEKSI: BERANDA -->
                <div id="sec-home" class="animate-screen w-full">
                    <!-- Header Melengkung Biru -->
                    <div class="bg-[#9cb5ff] rounded-b-3xl p-5 pt-8 shadow-md text-white">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <div class="flex items-center gap-2">
                                    <i class="fas fa-wallet text-2xl"></i>
                                    <h1 class="text-xl font-bold tracking-widest">HEMATYUK</h1>
                                </div>
                                <p class="mt-2 text-sm opacity-90">Halo, <span id="display-name" class="font-bold"></span>!</p>
                            </div>
                            <button onclick="logout()" class="bg-white/20 p-3 rounded-full hover:bg-white/30 transition transform active:scale-90 shadow-sm">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>

                        <!-- Kartu Total Saldo -->
                        <div class="bg-white/20 backdrop-blur-md border border-white/40 rounded-2xl p-4 mb-4 shadow-sm text-center relative overflow-hidden">
                            <p class="text-xs mb-1 font-semibold opacity-90">Total Uang Saat ini</p>
                            <p class="text-2xl font-bold tracking-wider"><span class="text-lg">Rp</span> <span id="saldo-total">0</span></p>
                        </div>

                        <!-- Kartu Pemisahan Saldo -->
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-white/20 backdrop-blur-md border border-white/40 rounded-xl p-3 shadow-sm flex items-center gap-3">
                                <div class="bg-white/30 text-white p-2 rounded-lg"><i class="fas fa-dollar-sign"></i></div>
                                <div class="overflow-hidden">
                                    <p class="text-[10px] font-semibold opacity-90">uang cash</p>
                                    <p class="text-sm font-bold truncate">Rp <span id="saldo-cash">0</span></p>
                                </div>
                            </div>
                            <div class="bg-white/20 backdrop-blur-md border border-white/40 rounded-xl p-3 shadow-sm flex items-center gap-3">
                                <div class="bg-white/30 text-white p-2 rounded-lg text-sm"><i class="fas fa-credit-card"></i></div>
                                <div class="overflow-hidden">
                                    <p class="text-[10px] font-semibold opacity-90">uang digital</p>
                                    <p class="text-sm font-bold truncate">Rp <span id="saldo-digital">0</span></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tombol Cepat di Bawah Header -->
                    <div class="p-5 mt-2">
                        <h3 class="font-bold text-gray-700 mb-3 text-sm">Aksi Cepat</h3>
                        <button onclick="nav('input')" class="w-full bg-white border border-gray-100 text-[#9cb5ff] p-4 rounded-2xl font-bold shadow-sm hover:shadow-md transition transform active:scale-95 text-sm flex items-center justify-center gap-3">
                            <i class="fas fa-plus-circle text-lg"></i> Catat Transaksi Baru
                        </button>
                    </div>
                </div>

                <!-- SEKSI: INPUT TRANSAKSI -->
                <div id="sec-input" class="animate-screen hidden w-full p-5 pt-8">
                    <h2 class="text-xl font-bold text-gray-800 mb-5 border-b pb-2">Pencatatan Data</h2>
                    
                    <!-- TAB TIPE TRANSAKSI (Termasuk Transfer) -->
                    <div class="flex bg-gray-200 p-1 rounded-full mb-6">
                        <button type="button" id="tab-pemasukan" onclick="setTxType('Pemasukan')" class="flex-1 py-2.5 rounded-full bg-white shadow text-[#9cb5ff] font-bold text-[11px] sm:text-xs transition transform active:scale-95">Pemasukan</button>
                        <button type="button" id="tab-pengeluaran" onclick="setTxType('Pengeluaran')" class="flex-1 py-2.5 rounded-full text-gray-400 font-bold text-[11px] sm:text-xs transition transform active:scale-95">Pengeluaran</button>
                        <button type="button" id="tab-transfer" onclick="setTxType('Transfer')" class="flex-1 py-2.5 rounded-full text-gray-400 font-bold text-[11px] sm:text-xs transition transform active:scale-95">Transfer</button>
                    </div>

                    <form id="form-transaksi" class="space-y-4" onsubmit="saveTransaction(event)">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">Dompet / Arah Transfer</label>
                            <select id="input-wallet" class="w-full border border-gray-200 p-3 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#9cb5ff]" required>
                                <option value="cash">Uang Cash</option>
                                <option value="digital">Uang Digital</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">Nominal (Rp)</label>
                            <input type="number" id="input-nominal" class="w-full border border-gray-200 p-3 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#9cb5ff]" placeholder="0" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">Tanggal</label>
                            <input type="date" id="input-date" class="w-full border border-gray-200 p-3 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#9cb5ff]" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">Kategori / Judul</label>
                            <input type="text" id="input-category" class="w-full border border-gray-200 p-3 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#9cb5ff]" placeholder="Misal: Gaji, Makan, Top Up..." required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">Catatan Tambahan</label>
                            <textarea id="input-notes" class="w-full border border-gray-200 p-3 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#9cb5ff]" placeholder="Opsional" rows="2"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-[#9cb5ff] text-white p-3 rounded-xl font-bold shadow-md hover:bg-blue-500 transition transform active:scale-95 mt-4">Simpan Data</button>
                    </form>
                </div>

                <!-- SEKSI: STATISTIK -->
                <div id="sec-stats" class="animate-screen hidden w-full p-5 pt-8">
                    <h2 class="text-xl font-bold text-gray-800 mb-5 border-b pb-2">Statistik Bulan Ini</h2>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-5">
                        <canvas id="myChart" class="w-full h-52"></canvas>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 text-center">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Pemasukan Total</p>
                        <p class="text-xl font-bold text-green-500 mt-1">Rp <span id="stat-income">0</span></p>
                        <hr class="my-4 border-gray-100">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Pengeluaran Total</p>
                        <p class="text-xl font-bold text-red-500 mt-1">Rp <span id="stat-expense">0</span></p>
                    </div>
                </div>

                <!-- SEKSI: RIWAYAT -->
                <div id="sec-history" class="animate-screen hidden w-full p-5 pt-8">
                    <h2 class="text-xl font-bold text-gray-800 mb-5 border-b pb-2">Riwayat Transaksi</h2>
                    <div id="history-list" class="space-y-3 pb-6">
                        <!-- Data riwayat dimasukkan lewat JS -->
                    </div>
                </div>
            </div>

            <!-- BOTTOM NAVIGATION BAR -->
            <div class="bg-white border-t border-gray-100 flex justify-around p-2 pb-3 absolute bottom-0 w-full z-20 shadow-[0_-10px_20px_-15px_rgba(0,0,0,0.1)]">
                <button onclick="nav('home')" class="flex flex-col items-center justify-center w-16 pt-2 text-[#9cb5ff] transition transform active:scale-90" id="nav-home">
                    <i class="fas fa-home text-xl mb-1"></i>
                    <span class="text-[9px] font-bold">Beranda</span>
                </button>
                <button onclick="nav('input')" class="flex flex-col items-center justify-center w-16 pt-2 text-gray-400 transition transform active:scale-90" id="nav-input">
                    <i class="fas fa-plus-circle text-xl mb-1"></i>
                    <span class="text-[9px] font-bold">Input</span>
                </button>
                <button onclick="nav('stats')" class="flex flex-col items-center justify-center w-16 pt-2 text-gray-400 transition transform active:scale-90" id="nav-stats">
                    <i class="fas fa-chart-line text-xl mb-1"></i>
                    <span class="text-[9px] font-bold">Statistik</span>
                </button>
                <button onclick="nav('history')" class="flex flex-col items-center justify-center w-16 pt-2 text-gray-400 transition transform active:scale-90" id="nav-history">
                    <i class="fas fa-history text-xl mb-1"></i>
                    <span class="text-[9px] font-bold">Riwayat</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL CUSTOM (Pengganti Alert) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center transform transition-transform scale-100">
            <h3 id="modal-title" class="text-lg font-bold text-gray-800 mb-2">Pesan</h3>
            <p id="modal-msg" class="text-sm text-gray-500 mb-6"></p>
            <button onclick="closeModal()" class="w-full bg-[#9cb5ff] text-white font-bold py-3 rounded-xl hover:bg-blue-500 transition transform active:scale-95 shadow-md">Tutup & Lanjutkan</button>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // ======= KONFIGURASI =======
        const STORAGE_KEY = 'hematyuk_data';
        const GOOGLE_SCRIPT_URL = ''; // Opsional: Isi dengan URL Apps Script untuk Online Sync

        let currentUser = null;
        let transactions = [];
        let currentTxType = 'Pemasukan';
        let myChartInstance = null;
        let deleteTimers = {};

        // ======= INIT & SERVICE WORKER (PWA) =======
        window.onload = () => {
            document.getElementById('input-date').valueAsDate = new Date();
            
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.currentUser) {
                        currentUser = data.currentUser;
                        transactions = data.transactions || [];
                        startApp();
                    }
                } catch(e) { console.error('Gagal memuat memori lokal', e); }
            }
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('PWA SW Gagal: ', err));
            });
        }

        // ======= NAVIGASI & UI =======
        function switchScreen(id) {
            ['screen-login', 'screen-register', 'screen-main'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            const sc = document.getElementById(id);
            sc.classList.remove('hidden');
            
            // Re-trigger animasi
            sc.classList.remove('animate-screen');
            void sc.offsetWidth; 
            sc.classList.add('animate-screen');
        }

        function nav(tab) {
            ['sec-home', 'sec-input', 'sec-stats', 'sec-history'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            ['nav-home', 'nav-input', 'nav-stats', 'nav-history'].forEach(id => {
                document.getElementById(id).classList.replace('text-[#9cb5ff]', 'text-gray-400');
            });

            const sec = document.getElementById(`sec-${tab}`);
            sec.classList.remove('hidden');
            sec.classList.remove('animate-screen');
            void sec.offsetWidth;
            sec.classList.add('animate-screen');

            document.getElementById(`nav-${tab}`).classList.replace('text-gray-400', 'text-[#9cb5ff]');

            if (tab === 'history') renderHistory();
            if (tab === 'stats') updateChart();
        }

        function showModal(title, msg) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('custom-modal').classList.replace('hidden', 'flex');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.replace('flex', 'hidden');
        }

        // ======= UTILITAS =======
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID').format(angka);
        }

        function generateId() {
            return Date.now().toString() + Math.random().toString(36).substr(2, 5);
        }

        function saveDataLocal() {
            if (currentUser) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ currentUser, transactions }));
            } else {
                localStorage.removeItem(STORAGE_KEY);
            }
        }

        async function syncToGoogle() {
            if (!GOOGLE_SCRIPT_URL) return;
            try {
                const payload = { action: 'saveData', userId: currentUser.id, name: currentUser.name, password: currentUser.password, transactions: JSON.stringify(transactions) };
                fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            } catch(e) { console.log('Sync error:', e); }
        }

        // ======= AUTENTIKASI =======
        function startApp() {
            document.getElementById('display-name').innerText = currentUser.name;
            switchScreen('screen-main');
            document.getElementById('screen-main').classList.replace('hidden', 'flex');
            nav('home');
            recalculateBalances();
        }

        async function register() {
            const name = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value.trim();
            if(!name || !pass) return showModal('Peringatan', 'Nama dan Password tidak boleh kosong!');

            showModal('Memproses...', 'Mendaftarkan akun Anda...');

            if (GOOGLE_SCRIPT_URL) {
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL + '?action=checkUser&name=' + encodeURIComponent(name));
                    const data = await res.json();
                    if (data.exists) return showModal('Gagal', 'Nama sudah terdaftar! Silakan gunakan nama lain atau login.');
                } catch (e) {} // Abaikan dan lanjut ke mode lokal
            }

            transactions = []; // Bersihkan histori agar data akun beda tidak campur
            currentUser = { id: generateId(), name: name, password: pass };
            
            saveDataLocal();
            closeModal();
            showModal('Berhasil', 'Akun berhasil dibuat! Data disimpan dengan aman di memori perangkat ini.');
            syncToGoogle();
            startApp();
        }

        async function login() {
            const name = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            if(!name || !pass) return showModal('Peringatan', 'Isi nama dan password!');

            showModal('Memproses...', 'Mengecek kecocokan data...');

            if (GOOGLE_SCRIPT_URL) {
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL + '?action=login&name=' + encodeURIComponent(name) + '&pass=' + encodeURIComponent(pass));
                    const data = await res.json();
                    if (data.success) {
                        currentUser = data.user;
                        transactions = JSON.parse(data.user.transactions || '[]');
                        saveDataLocal();
                        closeModal();
                        startApp();
                        return;
                    } else {
                        return showModal('Gagal', 'Kredensial tidak cocok dengan database online.');
                    }
                } catch (e) {}
            }
            
            // Cek lokal
            const local = localStorage.getItem(STORAGE_KEY);
            if(local) {
                const d = JSON.parse(local);
                if(d.currentUser && d.currentUser.name.toLowerCase() === name.toLowerCase() && d.currentUser.password === pass) {
                    currentUser = d.currentUser;
                    transactions = d.transactions || [];
                    closeModal();
                    startApp();
                    return;
                }
            }

            closeModal();
            showModal('Gagal', 'Akun tidak ditemukan. Silakan Daftar Baru.');
        }

        function logout() {
            currentUser = null;
            transactions = [];
            saveDataLocal();
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            switchScreen('screen-login');
        }

        // ======= PENGELOLAAN TRANSAKSI =======
        function setTxType(type) {
            currentTxType = type;
            
            // Reset Tombol
            ['tab-pemasukan', 'tab-pengeluaran', 'tab-transfer'].forEach(id => {
                document.getElementById(id).className = 'flex-1 py-2.5 rounded-full text-gray-400 font-bold text-[11px] sm:text-xs transition transform active:scale-95';
            });
            
            const walletSelect = document.getElementById('input-wallet');
            
            if (type === 'Pemasukan') {
                document.getElementById('tab-pemasukan').classList.add('bg-white', 'shadow', 'text-[#9cb5ff]');
                walletSelect.innerHTML = '<option value="cash">Uang Cash</option><option value="digital">Uang Digital</option>';
            } else if (type === 'Pengeluaran') {
                document.getElementById('tab-pengeluaran').classList.add('bg-white', 'shadow', 'text-red-400');
                walletSelect.innerHTML = '<option value="cash">Uang Cash</option><option value="digital">Uang Digital</option>';
            } else if (type === 'Transfer') {
                document.getElementById('tab-transfer').classList.add('bg-white', 'shadow', 'text-purple-500');
                walletSelect.innerHTML = '<option value="cash-ke-digital">Cash ➔ Digital (Setor)</option><option value="digital-ke-cash">Digital ➔ Cash (Tarik Tunai)</option>';
            }
        }

        function saveTransaction(e) {
            e.preventDefault();
            const nom = document.getElementById('input-nominal').value;
            const date = document.getElementById('input-date').value;
            const cat = document.getElementById('input-category').value;
            const notes = document.getElementById('input-notes').value;
            const wallet = document.getElementById('input-wallet').value;
            
            if(!nom || !date || !cat) return;

            transactions.push({
                id: generateId(),
                date: date,
                type: currentTxType,
                wallet: wallet,
                category: cat,
                notes: notes,
                nominal: parseFloat(nom)
            });

            saveDataLocal();
            syncToGoogle();
            
            document.getElementById('input-nominal').value = '';
            document.getElementById('input-category').value = '';
            document.getElementById('input-notes').value = '';
            
            recalculateBalances();
            showModal('Berhasil', 'Data transaksi berhasil disimpan!');
            nav('home');
        }

        // FUNGSI INTI: Kalkulasi ulang 100% dari riwayat
        function recalculateBalances() {
            let totalCash = 0;
            let totalDigital = 0;

            transactions.forEach(tx => {
                const nom = parseFloat(tx.nominal);
                if (tx.type === 'Pemasukan') {
                    if (tx.wallet === 'cash') totalCash += nom;
                    else totalDigital += nom;
                } else if (tx.type === 'Pengeluaran') {
                    if (tx.wallet === 'cash') totalCash -= nom;
                    else totalDigital -= nom;
                } else if (tx.type === 'Transfer') {
                    if (tx.wallet === 'cash-ke-digital') {
                        totalCash -= nom;
                        totalDigital += nom;
                    } else if (tx.wallet === 'digital-ke-cash') {
                        totalDigital -= nom;
                        totalCash += nom;
                    }
                }
            });

            document.getElementById('saldo-total').innerText = formatRupiah(totalCash + totalDigital);
            document.getElementById('saldo-cash').innerText = formatRupiah(totalCash);
            document.getElementById('saldo-digital').innerText = formatRupiah(totalDigital);
        }

        // ======= TAMPILAN RIWAYAT & HAPUS =======
        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            
            const sorted = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

            if (sorted.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-400 mt-10 text-sm italic">Belum ada riwayat transaksi.</p>';
                return;
            }

            sorted.forEach(tx => {
                let sign = '', color = '', icon = '';
                let dest = tx.wallet;

                if (tx.type === 'Pemasukan') {
                    sign = '+'; color = 'text-green-500'; icon = 'fa-arrow-down';
                } else if (tx.type === 'Pengeluaran') {
                    sign = '-'; color = 'text-red-500'; icon = 'fa-arrow-up';
                } else if (tx.type === 'Transfer') {
                    sign = '⇄'; color = 'text-purple-500'; icon = 'fa-exchange-alt';
                    dest = tx.wallet === 'cash-ke-digital' ? 'Setor ke Digital' : 'Tarik Tunai';
                }

                const div = document.createElement('div');
                div.className = 'bg-white p-3 rounded-2xl shadow-sm mb-3 flex justify-between items-center border border-gray-100 transition-all hover:shadow-md';
                div.innerHTML = `
                    <div class="flex items-center gap-3 w-[60%]">
                        <div class="min-w-[40px] h-10 rounded-full bg-gray-50 flex items-center justify-center ${color} border border-gray-100">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="overflow-hidden">
                            <p class="font-bold text-sm text-gray-800 truncate">${tx.category}</p>
                            <p class="text-[10px] text-gray-400 truncate">${tx.date} • ${dest}</p>
                            ${tx.notes ? `<p class="text-[10px] text-gray-400 italic mt-0.5 truncate">${tx.notes}</p>` : ''}
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-1 text-right">
                        <p class="font-bold text-sm ${color} whitespace-nowrap">${sign} Rp ${formatRupiah(tx.nominal)}</p>
                        <button id="btn-del-${tx.id}" onclick="startDeleteCountdown('${tx.id}')" class="text-red-300 hover:text-red-600 transition transform active:scale-90 text-xs">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function startDeleteCountdown(id) {
            const btn = document.getElementById(`btn-del-${id}`);
            if (btn.innerText.includes('Batal')) {
                clearInterval(deleteTimers[id].interval);
                clearTimeout(deleteTimers[id].timeout);
                delete deleteTimers[id];
                renderHistory();
                return;
            }

            let timeLeft = 10;
            btn.innerHTML = `<span class="text-[10px] font-bold bg-red-100 px-2 py-1 rounded text-red-600">Batal (${timeLeft}s)</span>`;
            
            deleteTimers[id] = {};
            deleteTimers[id].interval = setInterval(() => {
                timeLeft--;
                if(timeLeft > 0) btn.innerHTML = `<span class="text-[10px] font-bold bg-red-100 px-2 py-1 rounded text-red-600">Batal (${timeLeft}s)</span>`;
            }, 1000);

            deleteTimers[id].timeout = setTimeout(() => {
                clearInterval(deleteTimers[id].interval);
                deleteTransaction(id);
            }, 10000);
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => String(t.id) !== String(id));
            saveDataLocal();
            syncToGoogle();
            recalculateBalances();
            renderHistory();
        }

        // ======= STATISTIK & CHART =======
        function updateChart() {
            const ctx = document.getElementById('myChart');
            if (!ctx) return;
            if (myChartInstance) myChartInstance.destroy();

            const grouped = {};
            let totalIn = 0, totalOut = 0;
            const currentMonth = new Date().getMonth();

            transactions.forEach(tx => {
                const d = new Date(tx.date);
                if(d.getMonth() === currentMonth) {
                    if (tx.type === 'Pemasukan') totalIn += tx.nominal;
                    else if (tx.type === 'Pengeluaran') totalOut += tx.nominal;
                    
                    const dateStr = tx.date;
                    if(!grouped[dateStr]) grouped[dateStr] = { in: 0, out: 0 };
                    
                    if (tx.type === 'Pemasukan') grouped[dateStr].in += tx.nominal;
                    else if (tx.type === 'Pengeluaran') grouped[dateStr].out += tx.nominal;
                }
            });

            document.getElementById('stat-income').innerText = formatRupiah(totalIn);
            document.getElementById('stat-expense').innerText = formatRupiah(totalOut);

            const labels = [], incomes = [], expenses = [];
            Object.keys(grouped).sort().forEach(date => {
                const dParts = date.split('-');
                labels.push(`${dParts[2]}/${dParts[1]}`);
                incomes.push(grouped[date].in);
                expenses.push(grouped[date].out);
            });

            myChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Masuk', data: incomes, borderColor: '#4ade80', backgroundColor: '#4ade80', tension: 0.4 },
                        { label: 'Keluar', data: expenses, borderColor: '#f87171', backgroundColor: '#f87171', tension: 0.4 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { display: false } },
                    plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 6, font: { size: 10 } } } }
                }
            });
        }
    </script>
</body>
</html>
